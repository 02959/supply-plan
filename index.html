<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宿舍补给计划</title>
<style>
:root{
  --c:#4f46e5; --c2:#eef2ff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --bg:#f6f7fb; --card:#fff; --ok:#059669; --okbg:#ecfdf5;
  --warn:#d97706; --warnbg:#fffbeb; --bad:#dc2626; --badbg:#fef2f2;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:18px 14px 60px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--c2);color:#3730a3;
  border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.chip.g{background:var(--okbg);color:var(--ok)}
.chip.w{background:var(--warnbg);color:var(--warn)}
.chip.b{background:var(--badbg);color:var(--bad)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.alarm{border:1px solid #fde68a;background:linear-gradient(180deg,#fffbeb,#fff);border-radius:var(--r);padding:13px}
.alarm .d{font-size:19px;font-weight:800;letter-spacing:-.02em}
.alarm .n{font-size:13px;color:var(--muted);margin-top:2px}
.alarm .left{font-size:12px;font-weight:700;color:var(--warn);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
input[type=number],input[type=text]{padding:5px 7px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:14px;background:#fff;color:var(--ink);width:100%}
input[type=number]{width:76px}
input[type=number]:focus,input[type=text]:focus{outline:2px solid #c7d2fe;border-color:var(--c)}
select{padding:5px 7px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
button{font:inherit;border-radius:9px;border:1px solid var(--line);background:#fff;
  color:var(--ink);padding:6px 12px;cursor:pointer}
button.on{background:var(--c);border-color:var(--c);color:#fff}
button.ghost{background:transparent}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#f3f4f6;color:#4b5563;font-weight:600}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.bad{background:var(--badbg);color:var(--bad)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
svg{display:block;max-width:100%}
.hbar{height:6px;border-radius:999px;background:#eef2ff;overflow:hidden}
.hbar>i{display:block;height:100%;background:var(--c);border-radius:999px}
details summary{cursor:pointer;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"▾";margin-left:8px;color:var(--muted)}
details[open] summary:after{content:"▴"}
.foot{color:var(--muted);font-size:12.5px;line-height:1.9}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50}
.sheet[hidden]{display:none}
.sheet-box{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:420px;
  box-shadow:0 20px 50px rgba(16,24,40,.25)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;
  z-index:60;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.logline{display:flex;justify-content:space-between;gap:8px;padding:6px 0;
  border-bottom:1px dashed var(--line);font-size:13.5px}
.logline:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-end">
    <div>
      <h1>宿舍补给计划</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="row" id="head-chips"></div>
  </div>

  <div class="card">
    <h2>⏰ 快用完的（<span id="alert-n">0</span> 项在 15 天内）</h2>
    <div class="grid g4" id="alerts"></div>
    <div class="sub" id="alert-empty" style="display:none">15 天内没有会用完的东西，安心。</div>
  </div>

  <div class="card" id="next-card">
    <h2>🛒 最近一单</h2>
    <div id="next"></div>
  </div>

  <div class="card">
    <h2>📅 全部采购计划</h2>
    <div id="orders"></div>
    <div class="row" style="margin-top:12px">
      <span class="sub">安全库存</span>
      <select id="safety">
        <option value="3">3 天</option><option value="7">7 天</option>
        <option value="14">14 天</option><option value="21">21 天</option>
      </select>
      <span class="sub">合并窗口</span>
      <select id="merge">
        <option value="0">不合</option><option value="5">5 天</option>
        <option value="10">10 天</option><option value="20">20 天</option>
      </select>
      <button class="ghost" id="reset">恢复默认</button>
    </div>
  </div>

  <div class="card">
    <h2>📦 物品清单 <span class="sub" style="font-weight:400">（可直接改库存和月耗，下面全部实时重算）</span></h2>
    <details style="margin-bottom:10px">
      <summary class="sub">＋ 添加品类（存本机，可随导出带走；以后加商品不用改代码）</summary>
      <div class="grid g3" style="margin-top:10px">
        <input type="text" id="np-cat" placeholder="品类名，如 洗衣凝珠">
        <input type="text" id="np-unit" placeholder="单位：抽 / ml / g / 张">
        <input type="text" id="np-spec" placeholder="规格，如 3kg×2瓶">
        <input type="number" id="np-total" placeholder="每件总量数字">
        <input type="number" id="np-price" step="0.01" placeholder="单价 ¥">
        <input type="number" id="np-stock" placeholder="当前库存">
        <input type="number" id="np-rate" placeholder="月消耗">
      </div>
      <div class="row" style="margin-top:8px">
        <button id="np-add">添加</button>
        <span class="sub">最快/最慢按 ±15% 自动估</span>
      </div>
    </details>
    <div class="scroll">
      <table id="tbl">
        <thead><tr>
          <th>品类</th><th class="num">余量</th><th class="num">月耗</th>
          <th class="num">预计用完</th><th>最快~最慢</th><th class="num">单位价</th>
          <th>最优规格</th><th class="num">够用</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h2>📈 价格浮动</h2>
    <div class="row" style="margin-bottom:10px">
      <span class="sub">区间</span>
      <button data-r="7">7 天</button>
      <button data-r="30">30 天</button>
      <button data-r="90" class="on">90 天</button>
      <span class="sub">— 虚线是大促日；点图表右侧 ＋ 可补录一次价格</span>
    </div>
    <div class="grid g2" id="charts"></div>
  </div>

  <div class="card">
    <h2>🧾 打卡与数据</h2>
    <div class="row">
      <button id="exp">导出数据（cloud.json）</button>
      <button id="impbtn">导入数据</button>
      <input type="file" id="imp" accept="application/json,.json" hidden>
      <span class="sub">导出后放进 GitHub 仓库，手机打开时自动读这份基准</span>
    </div>
    <div id="loglist" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <h2>💰 成本概览</h2>
    <div class="grid g3" id="cost"></div>
  </div>

  <div class="card foot" id="foot"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <div class="row" style="justify-content:space-between">
      <b id="sh-title">打卡</b>
      <button class="ghost" id="sh-x" style="padding:2px 9px">✕</button>
    </div>
    <div class="sub" id="sh-sub" style="margin-top:4px"></div>
    <div class="row" style="margin-top:12px">
      <label class="sub" style="width:34px">件数</label>
      <input type="number" id="sh-qty" value="1" min="1" step="1" style="width:74px">
      <label class="sub">实付总价</label>
      <input type="number" id="sh-price" step="0.01" min="0" style="width:104px">
    </div>
    <div class="sub" id="sh-calc" style="margin-top:9px"></div>
    <div class="row" style="margin-top:14px">
      <button id="sh-ok" style="background:var(--c);color:#fff;border-color:var(--c)">记录这次购买</button>
      <button class="ghost" id="sh-cancel">取消</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = {"updated": "2026-11-21", "settings": {"safetyDays": 7, "freeShip": 59, "mergeWindow": 10, "protectDays": 30}, "milestones": [{"name": "双12", "d": "2026-12-12"}, {"name": "年货节", "d": "2027-01-15"}, {"name": "38节", "d": "2027-03-08"}, {"name": "618", "d": "2027-06-18"}, {"name": "双11", "d": "2027-11-11"}], "items": [{"cat": "抽纸", "name": "得宝 小雏菊 4层80抽", "unit": "抽", "stock": 600.0, "rate": 282.0, "rateFast": 343.0, "rateSlow": 240.0, "offers": [{"name": "得宝 小雏菊 4层80抽", "spec": "80抽×4包", "total": 320.0, "unit": "抽", "price": 12.23}, {"name": "得宝 小雏菊 4层80抽", "spec": "80抽×8包", "total": 640.0, "unit": "抽", "price": 26.73}], "hist": [{"d": "2026-11-06", "raw": 14.38, "per100": 4.4938, "total": 320.0}, {"d": "2026-11-13", "raw": 10.07, "per100": 3.1469, "total": 320.0}], "lastLow": 3.1469}, {"cat": "手帕纸", "name": "得宝 雪松香 4层7张", "unit": "张", "stock": 105.0, "rate": 75.0, "rateFast": 90.0, "rateSlow": 60.0, "offers": [{"name": "得宝 雪松香 4层7张", "spec": "7张×12包", "total": 84.0, "unit": "张", "price": 10.5}], "hist": [{"d": "2026-11-13", "raw": 10.5, "per100": 12.5, "total": 84.0}], "lastLow": 12.5}, {"cat": "洗脸巾", "name": "得宝 花漾肌 悬挂式", "unit": "抽", "stock": 180.0, "rate": 105.0, "rateFast": 120.0, "rateSlow": 90.0, "offers": [{"name": "得宝 花漾肌 悬挂式", "spec": "160抽", "total": 160.0, "unit": "抽", "price": 23.91}, {"name": "得宝 花漾肌 乳霜柔巾", "spec": "70抽×1包", "total": 70.0, "unit": "抽", "price": 22.4}], "hist": [{"d": "2026-11-13", "raw": 21.09, "per100": 13.1813, "total": 160.0}], "lastLow": 13.1813}, {"cat": "湿巾", "name": "洁柔 EDI纯水", "unit": "抽", "stock": 40.0, "rate": 32.0, "rateFast": 43.0, "rateSlow": 21.0, "offers": [{"name": "洁柔 EDI纯水", "spec": "80抽", "total": 80.0, "unit": "抽", "price": 8.75}], "hist": [], "lastLow": null}, {"cat": "洗手液", "name": "威露士 泡沫洗手液", "unit": "ml", "stock": 450.0, "rate": 135.0, "rateFast": 150.0, "rateSlow": 123.0, "offers": [{"name": "威露士 泡沫洗手液", "spec": "225ml×2瓶", "total": 450.0, "unit": "ml", "price": 32.91}], "hist": [], "lastLow": null}, {"cat": "牙膏", "name": "好易康 溶菌酶", "unit": "g", "stock": 120.0, "rate": 90.0, "rateFast": 98.0, "rateSlow": 83.0, "offers": [{"name": "好易康 溶菌酶", "spec": "120g", "total": 120.0, "unit": "g", "price": 32.91}], "hist": [], "lastLow": null}, {"cat": "洗衣液", "name": "威露士 松木香", "unit": "ml", "stock": 400.0, "rate": 750.0, "rateFast": 857.0, "rateSlow": 667.0, "offers": [{"name": "威露士 松木香", "spec": "1L", "total": 1000.0, "unit": "ml", "price": 18.9}], "hist": [], "lastLow": null}, {"cat": "衣物消毒液", "name": "滴露 柠檬除菌", "unit": "ml", "stock": 300.0, "rate": 600.0, "rateFast": 667.0, "rateSlow": 545.0, "offers": [{"name": "滴露 柠檬除菌", "spec": "750ml", "total": 750.0, "unit": "ml", "price": 27.9}], "hist": [], "lastLow": null}, {"cat": "沐浴露", "name": "威露士 松木精油", "unit": "ml", "stock": 150.0, "rate": 300.0, "rateFast": 321.0, "rateSlow": 281.0, "offers": [{"name": "威露士 松木精油", "spec": "300ml", "total": 300.0, "unit": "ml", "price": 31.9}], "hist": [], "lastLow": null}, {"cat": "洗发水", "name": "朴夏 绿柚香氛", "unit": "ml", "stock": 150.0, "rate": 288.0, "rateFast": 309.0, "rateSlow": 270.0, "offers": [{"name": "朴夏 绿柚香氛", "spec": "288ml", "total": 288.0, "unit": "ml", "price": 19.8}], "hist": [], "lastLow": null}, {"cat": "薄荷糖", "name": "都市牧场 无糖 柠檬", "unit": "g", "stock": 68.0, "rate": 54.0, "rateFast": 68.0, "rateSlow": 45.0, "offers": [{"name": "都市牧场 无糖 柠檬", "spec": "45g", "total": 45.0, "unit": "g", "price": 7.95}, {"name": "都市牧场 无糖 青橘", "spec": "45g", "total": 45.0, "unit": "g", "price": 9.47}], "hist": [{"d": "2026-11-09", "raw": 9.47, "per100": 21.0444, "total": 45.0}, {"d": "2026-11-09", "raw": 7.95, "per100": 17.6667, "total": 45.0}], "lastLow": 17.6667}]};
const S = DATA.settings;
const LS_KEY = "supply_extra_prices_v1";
const LS_OVR = "supply_overrides_v1";
/* 关键：用「打开页面的当天」算，而不是生成文件的日期 —— 否则过几天看就全是错的 */
const NOW = new Date();
const TODAY = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());

/* ---------- 日期工具 ---------- */
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
              + "-" + String(d.getDate()).padStart(2,"0");
const parseD = s => new Date(s + "T00:00:00");
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const diffD = (a,b) => Math.round((b-a)/86400000);
const md = s => s.slice(5);
const money = n => "¥" + (Math.round(n*100)/100).toFixed(2);

/* ---------- 额外补录的价格（存本地） ---------- */
let EXTRA = {};
try { EXTRA = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch(e){ EXTRA = {}; }
function saveExtra(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(EXTRA)); }catch(e){} }

/* 库存/月耗的人工调整也存本地，刷新、明天再打开都还在 */
let OVR = {};
try { OVR = JSON.parse(localStorage.getItem(LS_OVR) || "{}"); } catch(e){ OVR = {}; }
function saveOvr(){ try{ localStorage.setItem(LS_OVR, JSON.stringify(OVR)); }catch(e){} }

/* 打卡记录：买了什么、几件、多少钱 */
const LS_LOG = "supply_log_v1";
let LOG = [];
try { LOG = JSON.parse(localStorage.getItem(LS_LOG) || "[]"); } catch(e){ LOG = []; }
function saveLog(){ try{ localStorage.setItem(LS_LOG, JSON.stringify(LOG)); }catch(e){} }

/* 你自己加的品类：存本机，可随导出带走，不用改代码 */
const LS_ITEMS = "supply_custom_items_v1";
let CUSTOM = [];
try { CUSTOM = JSON.parse(localStorage.getItem(LS_ITEMS) || "[]"); } catch(e){ CUSTOM = []; }
function saveCustom(){ try{ localStorage.setItem(LS_ITEMS, JSON.stringify(CUSTOM)); }catch(e){} }
function applyCustom(){
  for (const it of CUSTOM){
    if (!DATA.items.some(x => x.cat === it.cat)){
      const o = Object.assign({}, it, { offers: (it.offers || []).slice(), hist: (it.hist || []).slice() });
      const ov = OVR[o.cat];
      if (ov){
        if (typeof ov.stock === "number") o.stock = ov.stock;
        if (typeof ov.rate === "number") o.rate = ov.rate;
      }
      DATA.items.push(o);
    }
  }
}
applyCustom();
DATA.items.forEach(it => {
  const o = OVR[it.cat];
  if (!o) return;
  if (typeof o.stock === "number") it.stock = o.stock;
  if (typeof o.rate === "number") it.rate = o.rate;
});

/* ---------- 状态 ---------- */
let ST = { safety: S.safetyDays, merge: S.mergeWindow, range: 90 };

/* ---------- 计算 ---------- */
function calcItem(it, safety){
  const perDay = it.rate / 30;
  const pFast = it.rateFast / 30, pSlow = it.rateSlow / 30;
  const dLeft = perDay > 0 ? it.stock / perDay : 1e9;
  const dEarly = pFast > 0 ? it.stock / pFast : 1e9;
  const dLate = pSlow > 0 ? it.stock / pSlow : 1e9;
  const best = it.offers[0] || null;
  const per100 = best ? best.price / best.total * 100 : null;
  const cover = best && perDay > 0 ? best.total / perDay : 1e9;
  const restockIn = dLeft - safety;
  return Object.assign({}, it, {
    dLeft, dEarly, dLate, best, per100, cover,
    runout: addD(TODAY, Math.round(Math.min(dLeft, 9999))),
    early: addD(TODAY, Math.round(Math.min(dEarly, 9999))),
    late: addD(TODAY, Math.round(Math.min(dLate, 9999))),
    restock: addD(TODAY, Math.max(0, Math.round(restockIn))),
    urgent: restockIn <= 0,
  });
}

function groupOrders(items){
  const list = items.filter(i => i.best).slice()
      .sort((a,b) => a.restock - b.restock);
  const orders = [];
  for (const it of list){
    let hit = null;
    for (const o of orders){
      if (Math.abs(diffD(o.date, it.restock)) <= ST.merge){ hit = o; break; }
    }
    if (hit){ hit.items.push(it); if (it.restock < hit.date) hit.date = it.restock; }
    else orders.push({ date: it.restock, items: [it] });
  }
  orders.sort((a,b) => a.date - b.date);
  for (const o of orders){
    o.total = o.items.reduce((s,i) => s + i.best.price, 0);
    o.protectUntil = addD(o.date, S.protectDays);
    o.ms = DATA.milestones.find(m => parseD(m.d) > o.date && parseD(m.d) <= o.protectUntil) || null;
  }
  return orders;
}

function mergeHint(orders, idx){
  const o = orders[idx], need = S.freeShip - o.total;
  if (need <= 0) return null;
  for (let j = idx-1; j >= 0; j--){
    const span = diffD(orders[j].date, o.date), merged = o.total + orders[j].total;
    if (span <= 60 && merged >= S.freeShip)
      return {type:"back", target:orders[j], span, merged};
  }
  if (idx + 1 < orders.length){
    const n = orders[idx+1], span = diffD(o.date, n.date), merged = o.total + n.total;
    if (span <= 60 && merged >= S.freeShip)
      return {type:"fwd", target:n, span, merged};
  }
  let best = null;
  for (let j = idx+1; j < orders.length; j++)
    for (const it of orders[j].items){
      const p = it.best.price;
      if (p >= need && (!best || p-need < best.over))
        best = {type:"item", it, date:orders[j].date, over:p-need};
    }
  return best;
}

/* ---------- 渲染 ---------- */
function h(html){ return html; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const items = DATA.items.map(it => calcItem(it, ST.safety));
  const orders = groupOrders(items);
  const soon = items.filter(i => i.dLeft <= 15).sort((a,b) => a.dLeft - b.dLeft);

  /* 头部 */
  const monthly = items.reduce((s,i) => s + (i.best ? i.best.price / (i.cover/30) : 0), 0);
  let lastPriceT = 0;
  DATA.items.forEach(i => i.hist.forEach(x => {
    const t = parseD(x.d).getTime(); if (t > lastPriceT) lastPriceT = t; }));

    '<span class="chip">' + (soon.length ? "⚠ " + soon.length + " 项快用完" : "✓ 暂无紧急") + '</span>' +

  document.getElementById("alerts").innerHTML = soon.map(i => `

      <div class="left">建议 ${esc(i.restock.toISOString().slice(5,10))} 下单</div>
    </div>`).join("");

  /* 最近一单 */
  const nx = orders[0];
  document.getElementById("next").innerHTML = nx ? (() => {
    const free = nx.total >= S.freeShip;
    const rows = nx.items.map(i => `<tr><td>${esc(i.cat)}</td>
        <td class="muted">${esc(i.best.spec)}</td>
        <td class="num">${money(i.best.price)}</td></tr>`).join("");
    const hint = free ? null : mergeHint(orders, 0);
    let hintHtml = "";
    if (hint){

      else if (hint.type === "fwd")
        hintHtml = `把 ${iso(hint.target.date)} 那单提前过来 → 合计 ${money(hint.merged)}，两单都免运费`;
      else
        hintHtml = `把「${esc(hint.it.cat)}」(${money(hint.it.best.price)}) 提前 → 合计 ${money(nx.total+hint.it.best.price)}，免运费`;
    }
    return `
      <div class="row" style="justify-content:space-between">
        <div><b style="font-size:19px">${iso(nx.date)}</b>
          <span class="sub">（${diffD(TODAY, nx.date)} 天后）</span></div>
        <div><b style="font-size:19px">${money(nx.total)}</b>
          <span class="tag ${free?"ok":"bad"}">${free?"免运费":"差 "+money(S.freeShip-nx.total)}</span></div>
      </div>
      <table style="margin-top:8px"><tbody>${rows}</tbody></table>
      <div class="sub" style="margin-top:8px">价保到 ${iso(nx.protectUntil)}${nx.ms?` · <b>覆盖 ${nx.ms.name}</b>（${md(nx.ms.d)}），当天降价可退差`:""}</div>
      ${hintHtml?`<div class="tag warn" style="margin-top:8px;display:inline-block">凑单：${hintHtml}</div>`:""}`;
  })() : '<div class="sub">暂时不需要买。</div>';

  /* 全部计划 */
  document.getElementById("orders").innerHTML = orders.map((o,idx) => {
    const free = o.total >= S.freeShip;
    const rows = o.items.map(i => `<tr><td>${esc(i.cat)}</td>
        <td class="muted">${esc(i.best.spec)}</td><td class="num">${money(i.best.price)}</td></tr>`).join("");
    const hint = free ? null : mergeHint(orders, idx);
    let hintHtml = "";
    if (hint){
      if (hint.type === "back") hintHtml = `凑单：提前 ${hint.span} 天并到 ${iso(hint.target.date)} → ${money(hint.merged)}，免运费`;
      else if (hint.type === "fwd") hintHtml = `凑单：把 ${iso(hint.target.date)} 那单提前过来 → ${money(hint.merged)}`;
      else hintHtml = `凑单：把「${esc(hint.it.cat)}」提前 → ${money(o.total+hint.it.best.price)}，免运费`;
    }
    return `<details ${idx===0?"open":""} style="border-bottom:1px solid var(--line);padding:10px 0">
      <summary>
        <span style="font-weight:700">${iso(o.date)}</span>
        <span class="sub">（${diffD(TODAY,o.date)} 天后 · ${o.items.length} 项）</span>
        <span style="float:right;font-variant-numeric:tabular-nums">
          <b>${money(o.total)}</b>
          <span class="tag ${free?"ok":"bad"}">${free?"免运费":"差 "+money(S.freeShip-o.total)}</span>
        </span>
      </summary>
      <table style="margin-top:8px"><tbody>${rows}</tbody></table>
      <div class="sub" style="margin-top:6px">价保到 ${iso(o.protectUntil)}${o.ms?` · <b>覆盖 ${o.ms.name}</b>（${md(o.ms.d)}）`:""}</div>
      ${hintHtml?`<div class="tag warn" style="margin-top:6px;display:inline-block">${hintHtml}</div>`:""}
    </details>`;
  }).join("") || '<div class="sub">暂无计划</div>';

  /* 物品清单 */
  const tb = document.querySelector("#tbl tbody");
  tb.innerHTML = items.map((i, k) => {
    const pct = Math.min(100, Math.max(0, 100 - i.dLeft/90*100));
    return `<tr data-k="${k}">
      <td><b>${esc(i.cat)}</b><div class="sub" style="font-size:12px">${esc(i.name)}</div></td>
      <td class="num"><input type="number" step="1" min="0" value="${Math.round(i.stock)}" data-f="stock">
        <div class="sub" style="font-size:11px">${esc(i.unit)}</div></td>
      <td class="num"><input type="number" step="1" min="0" value="${Math.round(i.rate)}" data-f="rate"></td>
      <td class="num">${iso(i.runout)}<div class="sub" style="font-size:11px">${Math.max(0,Math.round(i.dLeft))} 天后</div></td>
      <td class="sub" style="white-space:nowrap">${md(iso(i.early))} ~ ${md(iso(i.late))}</td>
      <td class="num">${i.per100!=null?i.per100.toFixed(3):"—"}<div class="sub" style="font-size:11px">元/100${esc(i.unit)}</div></td>
      <td class="sub" style="font-size:12.5px">${i.best?esc(i.best.spec)+" "+money(i.best.price):"—"}</td>
      <td class="num">${i.cover<9999?Math.round(i.cover)+" 天":"—"}
        <div class="hbar" style="margin-top:4px"><i style="width:${pct}%"></i></div></td>
      <td style="white-space:nowrap">
        <button class="ghost" data-checkin="${esc(i.cat)}" title="打卡：买了就点这个">🧾</button>
        <button class="ghost" data-add="${esc(i.cat)}" title="只记价格，不买">＋</button>
      </td>
    </tr>`;
  }).join("");

  /* 图表 */
  document.getElementById("charts").innerHTML =
    items.map(i => chartCard(i)).join("");

  /* 成本 */
  const consumables = items.reduce((s,i) => s + (i.best ? i.best.price / (i.cover/30) : 0), 0);
  const shipRisk = orders.filter(o => o.total < S.freeShip).length * 6;
  document.getElementById("cost").innerHTML = `
    <div><div class="sub">消耗品年支出</div><div style="font-size:20px;font-weight:700">${money(consumables*12)}</div>
      <div class="sub">月均 ${money(consumables)}</div></div>
    <div><div class="sub">本次计划的运费风险</div><div style="font-size:20px;font-weight:700">${money(shipRisk)}</div>
      <div class="sub">${orders.length} 单里 ${orders.filter(o=>o.total<S.freeShip).length} 单不足 ${money(S.freeShip)}</div></div>
    <div><div class="sub">价格样本</div><div style="font-size:20px;font-weight:700">${items.reduce((s,i)=>s+i.hist.length,0)} 条</div>
      <div class="sub">${items.filter(i=>i.hist.length>=2).length} 个品类可算价差</div></div>`;

  renderLog();

  document.getElementById("foot").innerHTML = `
    口径说明 · 免运费：京东自营满 ${money(S.freeShip)} 免基础运费 ${money(6)}；
    价保：家庭清洁/纸品、个人护理、食品饮料为 ${S.protectDays} 天，申请入口「我的订单 → 服务中心 → 价格保护」；
    单位价：价格 ÷ 总规格量 × 100（抽纸看元/100 抽、液体看元/100ml）；<br>
    安全库存 ${ST.safety} 天、合并窗口 ${ST.merge} 天、价保 ${S.protectDays} 天。
    数据只存这台设备（localStorage），补录的价格不会上传。`;
}

/* ---------- 图表 ---------- */
function priceSeries(it){
  const extra = (EXTRA[it.cat] || []);
  const h2 = it.hist.concat(extra).sort((a,b)=> a.d.localeCompare(b.d));
  return h2;
}

function chartCard(it){
  const best = it.best;
  const per100Now = best ? best.price/best.total*100 : null;
  const ser = priceSeries(it);
  const low = ser.length ? Math.min(...ser.map(x=>x.per100)) : null;
  const high = ser.length ? Math.max(...ser.map(x=>x.per100)) : null;
  const svg = sparkline(ser, it.cat);

  let verdict = "样本不足，先记两三次价再判断", cls = "";
  let forecast = "";
  if (ser.length >= 2 && per100Now != null && low != null){
    const gap = (per100Now - low) / (high || 1) * 100;
    if (gap < 3){ verdict = "当前就在历史低点附近，现在买"; cls = "ok"; }
    else if (gap < 12){ verdict = "中等位，不急"; cls = "warn"; }
    else { verdict = "明显偏高"; cls = "bad"; }
    const nm = DATA.milestones.find(m => parseD(m.d) > TODAY);
    if (nm && per100Now > low * 1.05){
      const target = low * 1.05;
      const saveYear = (per100Now - target) / 100 * it.rate * 12;
      forecast = "建议等 <b>" + nm.name + "</b>（" + md(nm.d) + "，" +
        diffD(TODAY, parseD(nm.d)) + " 天后），预计回到 ~" + target.toFixed(3) +
        " 元/100" + esc(it.unit) + "，一年可省 <b>" + money(saveYear) + "</b>";
      if (!cls) cls = "warn";
    } else if (nm){
      forecast = "已接近低点，不必等 " + nm.name + "（" + md(nm.d) + "）";
    }
  }

  return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px">
    <div class="row" style="justify-content:space-between">
      <b>${esc(it.cat)}</b>
      <span class="chip">${per100Now!=null?per100Now.toFixed(3):"—"} 元/100${esc(it.unit)}</span>
    </div>
    ${svg}
    <div class="sub" style="margin-top:6px">
      ${low!=null?`近 ${ST.range} 天：低 ${low.toFixed(3)} / 高 ${high.toFixed(3)}`:""}
    </div>
    <div style="margin-top:6px"><span class="tag ${cls}">${verdict}</span></div>
    ${forecast?`<div class="sub" style="margin-top:5px">${forecast}</div>`:""}
  </div>`;
}

function sparkline(ser, cat){
  const W = 300, H = 92, P = 8;
  const from = addD(TODAY, -ST.range);
  const pts = ser.filter(x => parseD(x.d) >= from);
  const msIn = DATA.milestones.filter(m => parseD(m.d) >= from && parseD(m.d) <= TODAY);
  if (!pts.length){
    return `<div class="sub" style="height:${H}px;display:flex;align-items:center;justify-content:center">
      近 ${ST.range} 天没有价格记录</div>`;
  }
  const xs = pts.map(p => parseD(p.d).getTime());
  const ys = pts.map(p => p.per100);
  const x0 = Math.min(...xs, from.getTime()), x1 = Math.max(...xs, TODAY.getTime());
  const ymin = Math.min(...ys), ymax = Math.max(...ys);
  const pad = (ymax - ymin) * 0.25 || Math.max(0.1, ymax * 0.1);
  const ly = ymin - pad, hy = ymax + pad;
  const X = t => P + (t - x0) / Math.max(1, x1 - x0) * (W - 2*P);
  const Y = v => H - P - (v - ly) / Math.max(1e-9, hy - ly) * (H - 2*P);
  let g = "";
  // 大促虚线
  for (const m of msIn){
    const mx = X(parseD(m.d).getTime());
    g += `<line x1="${mx}" y1="${P}" x2="${mx}" y2="${H-P}" stroke="#c7d2fe" stroke-width="1" stroke-dasharray="3 3"/>
          <text x="${mx}" y="${P+8}" font-size="8" fill="#6366f1" text-anchor="middle">${m.name}</text>`;
  }
  if (pts.length > 1){
    const d = pts.map((p,i) => (i?"L":"M") + X(parseD(p.d).getTime()).toFixed(1) + " " + Y(p.per100).toFixed(1)).join(" ");
    g += `<path d="${d}" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/>`;
    g += `<path d="${d} L${X(parseD(pts[pts.length-1].d).getTime()).toFixed(1)} ${H-P} L${X(parseD(pts[0].d).getTime()).toFixed(1)} ${H-P} Z"
           fill="#eef2ff" opacity=".7"/>`;
  }
  for (const p of pts){
    g += `<circle cx="${X(parseD(p.d).getTime()).toFixed(1)}" cy="${Y(p.per100).toFixed(1)}" r="3" fill="#4f46e5"/>`;
  }
  const first = pts[0].d.slice(5), last = pts[pts.length-1].d.slice(5);
  g += `<text x="${P}" y="${H-1}" font-size="8" fill="#9ca3af">${first}</text>`;
  g += `<text x="${W-P}" y="${H-1}" font-size="8" fill="#9ca3af" text-anchor="end">${last}</text>`;
  g += `<text x="${W-P}" y="${P+8}" font-size="8" fill="#9ca3af" text-anchor="end">${hy.toFixed(2)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}">${g}</svg>`;
}

/* ---------- 交互 ---------- */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "imp" && t.files && t.files[0]){ importJSON(t.files[0]); t.value = ""; return; }
  if (t.dataset && t.dataset.f){
    const tr = t.closest("tr"), k = +tr.dataset.k;
    const v = parseFloat(t.value);
    if (!isNaN(v) && v >= 0){
      const f = t.dataset.f === "stock" ? "stock" : "rate";
      const cat = DATA.items[k].cat;
      DATA.items[k][f] = v;
      OVR[cat] = OVR[cat] || {};
      OVR[cat][f] = v;
      saveOvr();
    }
    render();
  }
  if (t.id === "safety"){ ST.safety = +t.value; render(); }
  if (t.id === "merge"){ ST.merge = +t.value; render(); }
});

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.r){ ST.range = +t.dataset.r; render(); return; }
  if (t.dataset.checkin){ openCheckin(t.dataset.checkin); return; }
  if (t.id === "exp"){ exportJSON(); return; }
  if (t.id === "np-add"){ addItem(); return; }
  if (t.id === "impbtn"){ document.getElementById("imp").click(); return; }
  if (t.id === "sh-ok"){ submitCheckin(); return; }
  if (t.id === "sh-cancel" || t.id === "sh-x"){ closeCheckin(); return; }
  if (t.id === "reset"){ ST.safety = S.safetyDays; ST.merge = S.mergeWindow;
    document.getElementById("safety").value = ST.safety;
    document.getElementById("merge").value = ST.merge; render(); return; }
  if (t.dataset.add){
    const cat = t.dataset.add;
    const it = DATA.items.find(x => x.cat === cat);
    const best = it && it.offers[0];
    const q = "补录一次价格 —— " + cat + (best ? "（" + best.spec + "）" : "") + "\n请输入这件商品的实付总价（元）：";
    const v = window.prompt(q, best ? String(best.price) : "");
    if (v == null) return;
    const price = parseFloat(v);
    if (!price || price <= 0 || !best) return;
    EXTRA[cat] = EXTRA[cat] || [];
    EXTRA[cat].push({ d: iso(TODAY), raw: price, total: best.total,
                      per100: +(price / best.total * 100).toFixed(4) });
    saveExtra(); render(); return;
  }
});

/* ---------- 打卡 / 数据 ---------- */
let SH = { cat: null };

function toast(msg){
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg; t.classList.add("on");
  setTimeout(() => t.classList.remove("on"), 1800);
}

function openCheckin(cat){
  const it = DATA.items.find(x => x.cat === cat);
  if (!it || !it.offers.length) return;
  const best = it.offers[0];
  SH.cat = cat;
  document.getElementById("sh-title").textContent = "打卡 · " + cat;
  document.getElementById("sh-sub").textContent =
    best.spec + " · 当前单价 " + money(best.price) +
    " · 库存 " + Math.round(it.stock) + " " + it.unit;
  document.getElementById("sh-qty").value = 1;
  document.getElementById("sh-price").value = best.price.toFixed(2);
  previewCheckin();
  document.getElementById("sheet").hidden = false;
}

function closeCheckin(){
  document.getElementById("sheet").hidden = true;
  SH.cat = null;
}

function previewCheckin(){
  const it = DATA.items.find(x => x.cat === SH.cat);
  if (!it || !it.offers.length) return;
  const best = it.offers[0];
  const qty = Math.max(1, Math.round(parseFloat(document.getElementById("sh-qty").value) || 1));
  const price = parseFloat(document.getElementById("sh-price").value) || 0;
  const addQty = qty * best.total;
  const base = best.price / best.total * 100;
  const per100 = price > 0 ? price / addQty * 100 : null;
  let note = "填个实付总价才能算单位价";
  if (per100 != null){
    note = "单位价 <b>" + per100.toFixed(3) + " 元/100" + it.unit + "</b>" +
      (per100 < base - 0.001 ? "（比当前便宜 " + ((1 - per100 / base) * 100).toFixed(0) + "%）"
                             : (per100 > base + 0.001 ? "（比当前贵）" : "（与当前持平）"));
  }
  document.getElementById("sh-calc").innerHTML =
    "库存 " + Math.round(it.stock) + " → <b>" + Math.round(it.stock + addQty) + " " + it.unit +
    "</b>（+" + addQty + "）<br>" + note;
}

function submitCheckin(){
  const it = DATA.items.find(x => x.cat === SH.cat);
  if (!it || !it.offers.length) return closeCheckin();
  const best = it.offers[0];
  const qty = Math.max(1, Math.round(parseFloat(document.getElementById("sh-qty").value) || 1));
  const price = parseFloat(document.getElementById("sh-price").value);
  if (!price || price <= 0){ toast("请填实付总价"); return; }

  const addQty = qty * best.total;
  it.stock = Math.round((it.stock + addQty) * 100) / 100;
  OVR[it.cat] = OVR[it.cat] || {};
  OVR[it.cat].stock = it.stock;
  saveOvr();

  const per100 = +(price / addQty * 100).toFixed(4);
  LOG.unshift({ d: iso(TODAY), cat: it.cat, unit: it.unit, qty: qty,
                price: price, total: best.total, spec: best.spec, per100: per100 });
  LOG = LOG.slice(0, 200);
  saveLog();

  EXTRA[it.cat] = EXTRA[it.cat] || [];
  EXTRA[it.cat].push({ d: iso(TODAY), raw: price, total: best.total, per100: per100 });
  saveExtra();

  closeCheckin();
  render();
  toast("已记录：" + it.cat + " +" + addQty + it.unit);
}

function renderLog(){
  const el = document.getElementById("loglist");
  if (!el) return;
  if (!LOG.length){
    el.innerHTML = '<div class="sub">还没有打卡记录。买完点表格行尾的 🧾，库存和价格会一起更新。</div>';
    return;
  }
  el.innerHTML = '<div class="sub" style="margin-bottom:4px">最近打卡（共 ' + LOG.length + ' 条）</div>' +
    LOG.slice(0, 5).map(r =>
      '<div class="logline"><span>' + esc(r.d) + ' · ' + esc(r.cat) + ' ×' + r.qty + '</span>' +
      '<span>' + money(r.price) + ' <span class="sub">(' + Number(r.per100).toFixed(3) +
      ' 元/100' + esc(r.unit || "") + ')</span></span></div>').join("");
}

function addItem(){
  const g = id => document.getElementById(id);
  const cat = (g("np-cat").value || "").trim();
  const unit = (g("np-unit").value || "").trim();
  const spec = (g("np-spec").value || "").trim() || "1件";
  const total = parseFloat(g("np-total").value);
  const price = parseFloat(g("np-price").value);
  const stock = parseFloat(g("np-stock").value) || 0;
  const rate = parseFloat(g("np-rate").value) || 0;
  if (!cat || !unit || !(total > 0) || !(price > 0)){ toast("品类、单位、每件总量、单价 都要填"); return; }
  if (DATA.items.some(x => x.cat === cat)){ toast("已经有这个品类了"); return; }
  const it = {
    cat: cat, name: cat + " " + spec, unit: unit, stock: stock, rate: rate,
    rateFast: rate * 1.15, rateSlow: rate * 0.85,
    offers: [{ name: cat + " " + spec, spec: spec, total: total, unit: unit, price: price }],
    hist: [], lastLow: null,
  };
  CUSTOM.push(it); saveCustom(); DATA.items.push(it);
  ["np-cat","np-unit","np-spec","np-total","np-price","np-stock","np-rate"]
    .forEach(k => { g(k).value = ""; });
  render(); toast("已添加：" + cat);
}

function exportJSON(){
  const payload = { version: 1, exportedAt: iso(TODAY), dataDate: DATA.updated,
                    overrides: OVR, extra: EXTRA, log: LOG, custom: CUSTOM };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cloud.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("已导出 cloud.json");
}

function applyOverrides(){
  DATA.items.forEach(it => {
    const o = OVR[it.cat];
    if (!o) return;
    if (typeof o.stock === "number") it.stock = o.stock;
    if (typeof o.rate === "number") it.rate = o.rate;
  });
}

function mergePayload(p){
  if (p.overrides) for (const k in p.overrides){
    OVR[k] = OVR[k] || {};
    for (const f in p.overrides[k]) if (typeof p.overrides[k][f] === "number") OVR[k][f] = p.overrides[k][f];
  }
  if (p.extra) for (const k in p.extra){
    EXTRA[k] = EXTRA[k] || [];
    for (const r of p.extra[k])
      if (!EXTRA[k].some(x => x.d === r.d && Math.abs(x.raw - r.raw) < 1e-9)) EXTRA[k].push(r);
  }
  if (Array.isArray(p.log)) for (const r of p.log)
    if (!LOG.some(x => x.d === r.d && x.cat === r.cat && Math.abs(x.price - r.price) < 1e-9)) LOG.push(r);
  LOG.sort((a, b) => String(b.d).localeCompare(String(a.d)));
  if (Array.isArray(p.custom)) for (const it of p.custom)
    if (it && it.cat && !CUSTOM.some(x => x.cat === it.cat)) CUSTOM.push(it);
  saveOvr(); saveExtra(); saveLog(); saveCustom(); applyOverrides(); applyCustom();
}

function importJSON(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      mergePayload(JSON.parse(String(rd.result)));
      closeCheckin();
      render();
      toast("导入成功");
    } catch (e) { toast("文件解析失败：" + e.message); }
  };
  rd.readAsText(file, "utf-8");
}

/* 打开时读同目录的 cloud.json 作为基准；file:// 下会静默失败，不影响本地使用 */
function loadCloud(){
  try {
    fetch("cloud.json", { cache: "no-store" })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d) return;
        const empty = !d.overrides || !Object.keys(d.overrides).length;
        const noLog = !d.log || !d.log.length;
        const noExtra = !d.extra || !Object.keys(d.extra).length;
        if (empty && noLog && noExtra) return;
        if (!Object.keys(OVR).length && !LOG.length){
          mergePayload(d);
          render();
          toast("已载入云端基准");
        }
      })
      .catch(() => {});
  } catch (e) {}
}

document.addEventListener("input", e => {
  const id = e.target && e.target.id;
  if (id === "sh-qty" || id === "sh-price") previewCheckin();
});

/* 区间按钮高亮 */
const _render = render;
render = function(){
  _render();
  document.querySelectorAll("button[data-r]").forEach(b =>
    b.classList.toggle("on", +b.dataset.r === ST.range));
};
render();
loadCloud();

/* 可选：同目录的 data.json 会覆盖内置数据。
   好处是以后加商品只改 data.json（GitHub 网页上就能改），不用重新生成 HTML。 */
try {
  fetch("data.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(d => {
      if (!d || !Array.isArray(d.items) || !d.items.length) return;
      DATA.items = d.items.map(x => Object.assign({ offers: [], hist: [] }, x));
      if (d.settings) Object.assign(S, d.settings);
      if (d.updated) DATA.updated = d.updated;
      if (Array.isArray(d.milestones) && d.milestones.length) DATA.milestones = d.milestones;
      applyOverrides(); applyCustom(); render();
      toast("已载入 data.json（" + DATA.items.length + " 项）");
    })
    .catch(() => {});
} catch (e) {}
</script>
