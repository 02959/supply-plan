<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>价格浮动 · 宿舍补给计划</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="price">
<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-end">
    <div>
      <h1>价格浮动</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="row" id="head-chips"></div>
  </div>
  <nav class="nav"><a class="navbtn" href="index.html">📌 主页</a><a class="navbtn" href="plan.html">📅 全部计划</a><a class="navbtn" href="items.html">📦 物品清单</a><a class="navbtn on" href="price.html">📈 价格浮动</a><a class="navbtn" href="cost.html">💰 成本与打卡</a></nav>
  
  <div class="card">
    <h2>📝 每日录价 <span class="sub" style="font-weight:400">每个规格一行，留空的跳过</span></h2>
    <div class="row" style="margin-bottom:10px">
      <span class="sub">日期</span>
      <input type="date" id="pl-date" style="width:150px">
      <span class="sub" id="pl-progress"></span>
      <button id="pl-save" style="background:var(--c);color:#fff;border-color:var(--c)">保存</button>
    </div>
    <div class="scroll">
      <table id="pl-tbl">
        <thead><tr>
          <th>品类</th><th>规格</th><th class="num">上次</th><th class="num">看到的实付价</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="sub" style="margin-top:8px">
      每个规格单独记一条历史，互不干扰。品类后面的 ＋ 可以加新规格（比如 8 包装）；同一天同一规格再存会覆盖。
    </div>
  </div>
  <div class="card">
    <h2>📈 价格浮动</h2>
    <div class="row" style="margin-bottom:10px">
      <span class="sub">区间</span>
      <button data-r="7">7 天</button>
      <button data-r="30">30 天</button>
      <button data-r="90" class="on">90 天</button>
      <span class="sub">虚线是大促日</span>
    </div>
    <div class="grid g2" id="charts"></div>
  </div>

</div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
